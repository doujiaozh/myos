name: Build OS Kernel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-nasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install NASM
      run: sudo apt-get install -y nasm
    - name: Compile Bootloader
      run: nasm -f bin boot.asm -o boot.bin
    - name: Compile Kernel
      run: nasm -f bin kernel.asm -o kernel.bin
    - name: Assemble Image
      run: |
        dd if=/dev/zero of=os.img bs=1M count=1
        dd if=boot.bin of=os.img conv=notrunc
        dd if=kernel.bin of=os.img bs=512 seek=1 conv=notrunc
    - name: Verify Image Size
      run: ls -l os.img

  build-rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Rust
      run: rustup target add x86_64-unknown-none
    - name: Build Rust Skeleton
      run: |
        if [ -d "rust-kernel" ]; then
          cd rust-kernel
          cargo build --target x86_64-unknown-none --release
        else
          echo "Rust skeleton not found, skipping..."
        fi
