name: Build MyOS 
on: [push] 
jobs: 
  build: 
    runs-on: ubuntu-latest 
    steps: 
    - uses: actions/checkout@v3 
    - name: Install nasm 
      run: sudo apt-get install nasm 
    - name: Build bootloader 
      run: nasm -f bin nasm-2.16.01/boot/bios/boot.asm -o boot.bin 
    - name: Verify Output 
      run: ls -la boot.bin 
